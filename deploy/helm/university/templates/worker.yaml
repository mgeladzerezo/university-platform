apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "university.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "university.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "university.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {{- include "university.podSecurityContext" . | nindent 8 }}
      # Tasks are acknowledged late, so a job interrupted by shutdown is redelivered;
      # the grace period lets short jobs finish first.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "university.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
          args: ["--concurrency={{ .Values.worker.concurrency }}"]
          {{- include "university.backendEnv" . | nindent 10 }}
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
            periodSeconds: 60
            timeoutSeconds: 15
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "university.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# Celery beat schedules the nightly retention job. Exactly one replica: two
# schedulers would enqueue every periodic task twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-beat
  labels: {{- include "university.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "university.selectorLabels" (dict "root" . "component" "beat") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "university.selectorLabels" (dict "root" . "component" "beat") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "university.podSecurityContext" . | nindent 8 }}
      containers:
        - name: beat
          image: {{ include "university.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
          {{- include "university.backendEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.beat.resources | nindent 12 }}
          securityContext: {{- include "university.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
