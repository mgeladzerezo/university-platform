apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "university.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "university.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "university.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Roll pods when non-secret configuration changes.
        checksum/config: {{ .Values.config | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {{- include "university.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "university.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "university.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          {{- include "university.backendEnv" . | nindent 10 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          startupProbe:
            # Loading the embedding model takes a while on a cold node.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "university.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "university.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "university.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
