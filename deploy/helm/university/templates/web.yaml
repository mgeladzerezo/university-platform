apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "university.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "university.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "university.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "university.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "university.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # Server components call the API inside the cluster, not through the ingress.
            - name: API_INTERNAL_URL
              value: http://{{ .Release.Name }}-api/api/v1
          readinessProbe:
            httpGet: { path: /pl/contact, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "university.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # Next.js writes its ISR cache here.
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "university.labels" . | nindent 4 }}
spec:
  selector: {{- include "university.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
